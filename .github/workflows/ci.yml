name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check src tests eval

      - name: Format check (ruff)
        run: uv run ruff format --check src tests eval

      - name: Type check (mypy)
        run: uv run mypy src tests eval

      - name: Build vector store (needed for the retrieval-integration test)
        run: uv run python -m ingestion.build

      - name: Run tests with coverage
        run: uv run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
