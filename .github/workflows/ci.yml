name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.x"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests eval

      - name: Format check (ruff)
        run: uv run ruff format --check src tests eval

      - name: Type check (mypy)
        run: uv run mypy src tests eval

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.x"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      # The model names live in config.py, so its hash keys the cache.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/common/config.py') }}

      - name: Build vector store (needed for the retrieval-integration test)
        run: uv run python -m ingestion.build

      - name: Run tests with coverage
        run: uv run pytest --cov-report=xml --cov-fail-under=98

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: doc-qa-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image ls doc-qa-agent:ci --format 'Image size: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      # Without a network, a request that abstains exercises everything baked into the image
      # (both models, both collections) and needs no LLM.
      - name: Smoke test, offline
        run: |
          docker run -d --name docqa --network none doc-qa-agent:ci
          for _ in $(seq 1 60); do
            if docker exec docqa python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec -i docqa python - <<'EOF'
          import json
          import urllib.request

          payload = {
              "question": "How do I train a random forest classifier with scikit-learn?",
              "mode": "hybrid_rerank",
          }
          request = urllib.request.Request(
              "http://localhost:8000/ask",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          body = json.load(urllib.request.urlopen(request))
          assert body["abstained"] is True, body
          print("Abstained offline, as expected.")
          EOF

      - name: Container logs
        if: always()
        run: docker logs docqa || true

  # Only on a version tag, and only once everything above has passed.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
