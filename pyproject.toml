[project]
name = "docqa-agent"
version = "0.1.0"
description = "Retrieval-augmented Q&A over the official FastAPI documentation, with sourced citations and a real retrieval-evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Thomas", email = "thomas@example.com" }]
license = { text = "MIT" }

dependencies = [
    "sentence-transformers>=3.3.1",
    "chromadb>=0.5.20",
    "tiktoken>=0.8.0",
    "langchain-text-splitters>=0.3.2",
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.6,<0.3.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
docqa-fetch = "ingestion.fetch:main"
docqa-build = "ingestion.build:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "UP042", # `class Foo(str, Enum)` — intentional, gives JSON-serializable enums
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship no py.typed marker / stub package, so mypy can't
# analyze their types. Scoped narrowly (not a global ignore_missing_imports)
# to keep --strict meaningful everywhere else.
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --cov=src --cov-report=term-missing"
markers = [
    "integration: exercises the real BGE embedding model (network on first run, to download it)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/retrieval", "src/generation", "src/api", "src/common"]
