# Out-of-domain evaluation set: questions the corpus in data/raw/ cannot answer, so the
# only correct response is a refusal (hence no `expected_answer`). Weighted toward hard
# cases (adjacent frameworks, shared vocabulary) over easy `unrelated` controls.
# Used by eval/run_eval.py for the abstention metrics and the --sweep threshold grid.

- id: ood01
  category: adjacent-framework
  question: |-
    How do I write a Django middleware class that adds a response header to every request?
  why: |-
    The corpus documents FastAPI/Starlette middleware, not Django's. Shares the words "middleware", "response" and "header" with tutorial/middleware.md and advanced/middleware.md, so lexical retrieval will return confident, wrong passages.

- id: ood02
  category: adjacent-framework
  question: |-
    How do I define a Flask blueprint and register it on the application?
  why: |-
    Flask blueprints are the rough equivalent of FastAPI's APIRouter, which tutorial/bigger-applications.md covers — a near-miss the dense retriever is especially prone to, since the two concepts are semantically close.

- id: ood03
  category: adjacent-framework
  question: |-
    How do I add a serializer class in Django REST Framework to validate incoming data?
  why: |-
    DRF serializers play the role Pydantic models play in FastAPI, so this is topically adjacent to tutorial/body.md without being answerable from it.

- id: ood04
  category: shared-vocabulary
  question: |-
    How do I train a random forest classifier with scikit-learn and check its accuracy?
  why: |-
    An entirely different domain phrased as a how-to question. Its distinctive terms ("train", "classifier", "accuracy") never appear in the corpus, so any overlap is limited to generic words.

- id: ood05
  category: shared-vocabulary
  question: |-
    How do I create a database index in PostgreSQL to speed up a slow query?
  why: |-
    "Database", "query" and "index" all occur throughout tutorial/sql-databases.md, but the corpus never covers raw PostgreSQL administration.

- id: ood06
  category: shared-vocabulary
  question: |-
    What is the difference between a Docker image and a Docker container?
  why: |-
    Deployment vocabulary overlaps the corpus's, but the deployment pages were deliberately excluded from the fetched page list (see ingestion/fetch.py).

- id: ood07
  category: wrong-language
  question: |-
    How do I define a REST controller in Spring Boot with Java annotations?
  why: |-
    Structurally the same question as declaring a FastAPI path operation, in a language and framework the corpus never mentions.

- id: ood08
  category: out-of-version
  question: |-
    What changed in FastAPI 0.200 and which versions of Pydantic does it support?
  why: |-
    About FastAPI, but the corpus is a documentation snapshot pinned to tag 0.141.1 (see data/raw/manifest.json) and contains no release notes or version history at all. The most dangerous shape: right topic, unanswerable specifics.

- id: ood09
  category: unrelated
  question: |-
    What is the capital of Australia and what is its population?
  why: |-
    A control: no lexical or semantic overlap whatsoever. Any working relevance floor must catch this one, so failing it indicates the gate is not functioning rather than that the threshold is merely too low.

- id: ood10
  category: unrelated
  question: |-
    Can you write me a limerick about a cat who learns to play the piano?
  why: |-
    A second control, and a different failure mode: an instruction rather than a question, of the kind a chat UI attracts regardless of what the system was built for.
