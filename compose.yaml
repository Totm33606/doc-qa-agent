# The API plus a local Ollama, so `docker compose up` needs nothing on the host.
# The first start pulls the LLM (~4.7GB for qwen2.5:7b-instruct) into the `ollama` volume.
# To use Azure OpenAI or OpenAI instead, set their variables in .env: Azure takes priority;
# for plain OpenAI also set LOCAL_LLM_BASE_URL= (empty) under `api.environment`.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: doc-qa-agent
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.34.4
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    # With an NVIDIA GPU and the NVIDIA Container Toolkit, uncomment to run the LLM on it:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the model (a no-op once it is in the volume), then exits.
  ollama-pull:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
